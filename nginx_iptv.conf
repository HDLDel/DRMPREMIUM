server {
    server_name _; # Escuta em qualquer IP ou domínio apontado para a VPS
    listen 80 backlog=4096 reuseport; # backlog maior: absorve pico de conexões no reboot dos canais

    # Arquivos HLS de canais são servidos direto deste diretório pelo Nginx
    root /dev/shm/iptv_canais;

    # Bloqueio de IPs (gerado automaticamente pelo painel)
    include /etc/nginx/blocked_ips.conf;

    # Bloqueio de User-Agents de bots/IA abusivos
    if ($http_user_agent ~* (GPTBot|ChatGPT-User|Google-Extended|Claude-Web|ClaudeBot|Bytespider|CCBot|PerplexityBot|Amazonbot|cohere-ai|OAI-SearchBot)) {
        return 403;
    }

    # OBRIGATÓRIO: Encaminha todas as requisições para o Node.js.
    # Isso impede que o Nginx sirva o Dashboard (index.html) ignorando a autenticação do server.js.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        # Start em massa e canais loop-cache demoram >60s para responder;
        # sem isso o nginx corta (504) e o painel mostra erro falso.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Segmentos de vídeo (.ts): o Nginx serve direto do disco, sem passar pelo Node.
    # Cobre tanto segment_007.ts (ao vivo) quanto 9.ts (relay loop).
    # Se o arquivo ainda não existir, cai no @canais_backend (Node) para canais dinâmicos.
    location ~ ^/canais/([0-9]+)/(segment_[0-9]+|[0-9]+)\.ts$ {
        try_files /$1/$2.ts @canais_backend;
        add_header Cache-Control "public, max-age=60";
        add_header X-Served-By "nginx-disk";
    }

    # Playlist (.m3u8): serve direto do disco, mas SEM cache (sempre fresca pra quem está assistindo).
    location ~ ^/canais/([0-9]+)/index\.m3u8$ {
        try_files /$1/index.m3u8 @canais_backend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Served-By "nginx-disk";
    }

    # Fallback: arquivo HLS que não está no disco vira requisição pro Node.js (relay/VOD).
    location @canais_backend {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        add_header X-Served-By "node-fallback";
    }

    # Tudo o mais em /canais/ (rotas de controle do painel) vai pro Node.js.
    location /canais/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Logs de erro e acesso do Nginx para este servidor virtual
    error_log /var/log/nginx/iptv_error.log;
    access_log /var/log/nginx/iptv_access.log;

    # Compressão gzip para o painel (HTML, JS, CSS e APIs JSON via proxy)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/x-javascript
        image/svg+xml;
}
