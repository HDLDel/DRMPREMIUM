server {
    listen 80;
    server_name _; # Escuta em qualquer IP ou domínio apontado para a VPS

    # Bloqueio de IPs (gerado automaticamente pelo painel)
    include /etc/nginx/blocked_ips.conf;

    # Bloqueio de User-Agents de bots/IA abusivos
    if ($http_user_agent ~* (GPTBot|ChatGPT-User|Google-Extended|Claude-Web|ClaudeBot|Bytespider|CCBot|PerplexityBot|Amazonbot|cohere-ai|OAI-SearchBot)) {
        return 403;
    }

    # OBRIGATÓRIO: Encaminha todas as requisições para o Node.js.
    # Isso impede que o Nginx sirva o Dashboard (index.html) ignorando a autenticação do server.js.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Servir segmentos HLS — tenta VOD primeiro, depois live
    location ~ ^/canais/(?<cid>\d+)/(?<cfile>.*\.(m3u8|ts))$ {
        set $hls_base /dev/shm/iptv_canais;
        if (-f /home/drmpremium/.vod_$cid) {
            set $hls_base /home/drmpremium/hls_pronto;
        }
        alias $hls_base/$cid/$cfile;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # Logs de erro e acesso do Nginx para este servidor virtual
    error_log /var/log/nginx/iptv_error.log;
    access_log /var/log/nginx/iptv_access.log;
}