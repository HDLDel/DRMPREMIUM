server {
    listen 80;
    server_name your_domain_or_ip; # Substitua pelo seu domínio ou IP do servidor

    # OBRIGATÓRIO: Encaminha todas as requisições para o Node.js.
    # Isso impede que o Nginx sirva o Dashboard (index.html) ignorando a autenticação do server.js.
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Servir os segmentos HLS e playlists diretamente do diretório 'canais'
    location ~ ^/canais/(\d+)/(.*\.m3u8|.*\.ts)$ {
        alias /home/drmpremium/canais/$1/$2;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # Logs de erro e acesso do Nginx para este servidor virtual
    error_log /var/log/nginx/iptv_error.log;
    access_log /var/log/nginx/iptv_access.log;
}