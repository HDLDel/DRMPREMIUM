<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel 24 Horas · DRM Premium — Acesso</title>
    <link rel="stylesheet" href="style.css?v=3.0.0">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="modal-head">
            <h2>DRM Premium 24 Horas</h2>
        </div>
        <div style="padding:22px;">
            <p class="login-subtitle">Acesse seu painel de controle</p>
            <div id="error-msg" class="login-error">Usuário ou senha inválidos.</div>
            <div class="field">
                <label for="user">Usuário</label>
                <input type="text" id="user" placeholder="Digite o usuário" autocomplete="username">
            </div>
            <div style="height:14px;"></div>
            <div class="field">
                <label for="pass">Senha</label>
                <input type="password" id="pass" placeholder="Digite a senha" autocomplete="current-password">
            </div>
            <button class="login-btn" onclick="doLogin()">Entrar</button>
        </div>
        <div class="login-footer">Sistema de Canais HLS · Acesso restrito</div>
    </div>

    <script>
        async function doLogin() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        document.getElementById('user').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('pass').focus();
        });
        document.getElementById('pass').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
