<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel 24 Horas · DRM Premium — Acesso</title>
    <link rel="stylesheet" href="style.css?v=4.0.0">
</head>
<body class="login-body">

    <button class="btn-theme" aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="login-card">
        <div class="modal-head">
            <h2>DRM Premium 24 Horas</h2>
        </div>
        <div class="login-card-body">
            <p class="login-subtitle">Acesse seu painel de controle</p>
            <div id="error-msg" class="login-error">Usuário ou senha inválidos.</div>
            <div class="field">
                <label for="user">Usuário</label>
                <input type="text" id="user" placeholder="Digite o usuário" autocomplete="username">
            </div>
            <div class="field-spacer"></div>
            <div class="field">
                <label for="pass">Senha</label>
                <input type="password" id="pass" placeholder="Digite a senha" autocomplete="current-password">
            </div>
            <button class="login-btn">Entrar</button>
        </div>
        <div class="login-footer">Sistema de Canais HLS · Acesso restrito</div>
    </div>

    <script src="login.js?v=4.0.0"></script>
</body>
</html>
