<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>IPTV Pro - Node Dashboard</title>
    <link rel="stylesheet" href="style.css?v=1.0.2"> 
</head>
<body>
    <div class="header">
        <h1>DRM PREMIUM 24 HORAS</h1>
        <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
    
    <div class="dashboard">
        <div class="card">
            <h3>CPU</h3>
            <div class="value" id="cpu-usage">0%</div>
        </div>
        <div class="card">
            <h3>RAM</h3>
            <div class="value" id="ram-usage">0%</div>
        </div>
        <div class="card">
            <h3>Disco</h3>
            <div class="value" id="disk-usage">0%</div>
        </div>
        <div class="card">
            <h3>Rede</h3>
            <div class="value" id="net-usage">0.00 Mbps</div>
        </div>
        <div class="card">
            <h3>Streams Ativos</h3>
            <div class="value" id="active-streams">0</div>
        </div>
    </div>

    <div class="channel-list">
        <h2>Canais Disponíveis</h2>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Buscar canais...">
            <button onclick="showCreateChannelModal()">Criar Novo Canal</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th onclick="sortTable('id')">ID <span id="sort-icon-id"></span></th>
                    <th onclick="sortTable('name')">Nome <span id="sort-icon-name"></span></th>
                    <th onclick="sortTable('status')">Status <span id="sort-icon-status"></span></th>
                    <th onclick="sortTable('uptime')">Uptime <span id="sort-icon-uptime"></span></th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="channels-table">
                <!-- Canais serão carregados aqui via JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Modal para Criar Canal -->
    <div id="create-channel-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:var(--card); padding:30px; border-radius:12px; width:400px; max-width: 90%;">
            <h2>Criar Novo Canal</h2>
            <label for="new-channel-name" style="display:block; margin-bottom:5px; color:var(--text);">Nome do Canal:</label>
            <input type="text" id="new-channel-name" placeholder="Ex: Filmes de Ação 24h" style="width:calc(100% - 18px); padding:8px; margin-bottom:15px; border-radius:4px; border:1px solid #30363d; background:#0a0e14; color:var(--text);">

            <label for="video-source-select" style="display:block; margin-bottom:5px; color:var(--text);">Pasta de Vídeos Fonte:</label>
            <select id="video-source-select" style="width:100%; padding:8px; margin-bottom:20px; border-radius:4px; border:1px solid #30363d; background:#0a0e14; color:var(--text);">
                <option value="">Carregando...</option>
                <!-- Options will be loaded here by JavaScript -->
            </select>
            <p style="font-size:0.8em; color:#8b949e; margin-top:-10px; margin-bottom:20px;">
                A pasta selecionada deve conter um arquivo `playlist.txt` com a lista de vídeos.
            </p>

            <div style="margin-bottom: 20px;">
                <input type="checkbox" id="use-transcode">
                <label for="use-transcode" style="color:var(--text); font-size:0.9em;">Ativar Transcodificação (Maior Estabilidade)</label>
            </div>

            <button onclick="createChannel()">Criar Canal</button>
            <button onclick="hideCreateChannelModal()" style="background:#555; margin-left:10px;">Cancelar</button>
        </div>
    </div>

    <!-- Modal para Logs -->
    <div id="logs-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:1001;">
        <div style="background:var(--card); padding:20px; border-radius:12px; width:80%; height:80%; display:flex; flex-direction:column;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h2 id="log-modal-title" style="margin:0;">Logs do Canal</h2>
                <button onclick="hideLogsModal()" style="background:#555;">Fechar</button>
            </div>
            <pre id="log-content" style="flex:1; background:#000; color:#0f0; padding:15px; overflow-y:auto; font-family:monospace; font-size:0.85em; border:1px solid #30363d; margin:0;"></pre>
        </div>
    </div>

    <button id="scroll-to-top" onclick="scrollToTop()">↑</button>

    <script src="script.js?v=1.0.2"></script>
</body>
</html>
